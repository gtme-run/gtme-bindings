# apollo/match-linkedin — apollo/enrich keyed on what a LinkedIn export
# carries. The shipped apollo/enrich reveals a person by Apollo id, which
# only an apollo/search source provides. Lists that come from LinkedIn
# (a connections export, a Sales Navigator pull) have a public profile URL,
# a name and a company instead; Apollo's People Match accepts all of those.
# Same endpoint, same revealed surface, same one credit per matched person.
# A copy of apollo/enrich with the request body and `needs` swapped; the
# record's own linkedin_url is kept (skip_if_input) and a no-match (404) or
# rejected input (422) skips the record rather than failing it, so people
# Apollo does not know continue through the pipeline with export fields only.
# Verified on gtme 0.8.0 (29 Oct 2026) with throwaway fixtures: a 404 yields
# the verdict "skip: Apollo has no match for this person" (the conformance
# kit reports a skip as a fixture failure, so the 404 case cannot live in
# fixtures/), and a 200 with "person": null extracts no record (empty, not
# failed). In a live run over roughly 2,300 LinkedIn-export records Apollo
# returned a person for every one.
#
# A matched person can still legitimately lack an email (the vendor knows
# the person but holds no address) — extraction treats a missing value as
# absent, never a failure; a downstream deliver's `on_missing` decides.
#
# Endpoint: POST https://api.apollo.io/api/v1/people/match
# Auth:     X-Api-Key header
# Docs:     https://docs.apollo.io/reference/people-enrichment

id: apollo/match-linkedin
version: 1
role: enrich
entity_type: person

needs:
  type: object
  required: [linkedin_url]
  properties:
    linkedin_url: { type: string }
    first_name: { type: string }
    last_name: { type: string }
    company_name: { type: string }

provides:
  type: object
  additionalProperties: false
  properties:
    email: { type: string }
    email_status: { type: string }
    first_name: { type: string }
    last_name: { type: string }
    full_name: { type: string }
    title: { type: string }
    seniority: { type: string }
    linkedin_url: { type: string }
    city: { type: string }
    state: { type: string }
    country: { type: string }
    company_name: { type: string }
    company_domain: { type: string }
    company_website: { type: string }
    company_linkedin_url: { type: string }
    company_industry: { type: string }
    company_employees: { type: integer }

config_schema:
  type: object
  additionalProperties: false
  properties:
    reveal_personal_emails:
      type: boolean
      description: Ask Apollo to include personal emails (their flag; off by default)
    base_url:
      type: string
      default: "https://api.apollo.io"
      description: Override the API host (testing)

credentials: [APOLLO_API_KEY]
freshness_days: 30
cost_estimate_usd: 0.01
keep_payloads: true
payload_ttl_days: 30

auth:
  type: header
  name: X-Api-Key
  env: APOLLO_API_KEY

request:
  method: POST
  url: "{{config.base_url}}/api/v1/people/match"
  headers:
    Cache-Control: no-cache
  body:
    linkedin_url: "{{record.linkedin_url}}"
    first_name: "{{record.first_name}}"
    last_name: "{{record.last_name}}"
    organization_name: "{{record.company_name}}"
    reveal_personal_emails: "{{config.reveal_personal_emails}}"

extract:
  records: person
  fields:
    first_name: first_name
    last_name: last_name
    full_name: name
    title: title
    seniority: { path: seniority, transform: lower }
    email:
      path: email
      transform: email
      absent: ["email_not_unlocked@domain.com"]
    email_status: { path: email_status, transform: lower }
    linkedin_url: { path: linkedin_url, transform: linkedin, skip_if_input: true }
    city: city
    state: state
    country: country
    company_name: organization.name
    company_website: organization.website_url
    company_linkedin_url: { path: organization.linkedin_url, transform: linkedin_url }
    company_industry: organization.industry
    company_domain:
      paths: [organization.primary_domain, organization.website_url]
      transform: domain
    company_employees:
      path: organization.estimated_num_employees
      absent: [0]

errors:
  "404": { verdict: skip, reason: "Apollo has no match for this person" }
  "422": { verdict: skip, reason: "Apollo rejected the match input" }
  "429": { verdict: retry, reason: "Apollo rate limit" }
  "5xx": { verdict: retry, reason: "Apollo transient error" }

retry:
  max_attempts: 4
  backoff_seconds: 2

cost:
  per: record
  amount_usd: 0.01
